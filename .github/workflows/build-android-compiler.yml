name: Build Android Compiler APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-compiler/**'
      - '.github/workflows/build-android-compiler.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon -p android-compiler assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Compiler-debug
          path: android-compiler/app/build/outputs/apk/debug/*.apk
