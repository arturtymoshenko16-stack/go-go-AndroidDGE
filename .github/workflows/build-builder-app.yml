name: Build FileHub APK Builder

on:
  push:
    branches: [ main, master ]
    paths:
      - 'builder-app/**'
      - '.github/workflows/build-builder-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.0.2'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build APK Builder
        working-directory: builder-app
        run: gradle assembleDebug --no-daemon --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-APK-Builder
          path: builder-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
