name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unpack project zip
        run: |
          mkdir -p _project
          for z in *.zip; do
            [ -f "$z" ] && unzip -oq "$z" -d _project
          done
          find _project -name '*.kt' -exec sed -i 's/fun setSort(/fun changeSort(/; s/vm\.setSort(/vm.changeSort(/g' {} +

      - name: Find project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit ${PIPESTATUS[0]}

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -n 20 | sed -E 's#^e: file://.*/com/filehub/app/#::error::#' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
