name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'myapp*.zip'
      - '**/myapp*.zip'
      - 'myapp*.7z'
      - '**/myapp*.7z'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unpack newest project archive (zip or 7z)
        run: |
          echo "Archives in repo (commit time, name):"
          ARC=""; BEST=0
          for f in *.zip *.7z; do
            [ -f "$f" ] || continue
            case "$f" in myapp*) continue ;; esac
            T=$(git log -1 --format=%ct -- "$f")
            echo "$T  $f"
            if [ "${T:-0}" -gt "$BEST" ]; then BEST=$T; ARC="$f"; fi
          done
          echo "Using $ARC"
          rm -rf _project && mkdir _project
          case "$ARC" in
            *.7z|*.7Z)
              command -v 7z >/dev/null || sudo apt-get install -y p7zip-full
              7z x -y -o_project "$ARC" > /dev/null ;;
            *) unzip -q "$ARC" -d _project ;;
          esac

      - name: Find project folder
        run: |
          S=$(find _project -name settings.gradle.kts | head -n 1)
          test -n "$S" || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV

      - name: Embed JDK and Gradle into the app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          D=app/src/main/assets/bundled
          mkdir -p $D
          mkdir -p _tmp
          curl -L --fail --retry 3 -o _tmp/jdk.zip https://github.com/Kitty-Hivens/nexira-android-jdk/releases/download/jdk-17.0.21/jdk-17.0.21-android-aarch64.zip
          # мини-JDK: убираем отладочные файлы и графические библиотеки (javac, d8, подпись их не используют)
          zip -q -d _tmp/jdk.zip '*.debuginfo' '*/lib/libawt*' '*/lib/libfontmanager*' '*/lib/libfreetype*' '*/lib/libjavajpeg*' '*/lib/liblcms*' '*/lib/libjsound*' '*/lib/libmlib_image*' '*/lib/libsplashscreen*' '*/lib/fonts/*' '*/lib/libjawt*' '*/lib/libattach*' '*/lib/libinstrument*' '*/lib/libdt_socket*' '*/lib/libjdwp*' '*/lib/libj2*' || true
          mkdir -p _tmp/jdk && unzip -q _tmp/jdk.zip -d _tmp/jdk
          tar -C _tmp/jdk -cf - . | xz -6e -T0 > $D/jdk.tar.xz
          curl -L --fail --retry 3 -o _tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p _tmp/gradle && unzip -q _tmp/gradle.zip -d _tmp/gradle
          tar -C _tmp/gradle -cf - . | xz -6e -T0 > $D/gradle.tar.xz
          rm -rf _tmp
          ls -l $D

      - name: Embed Android SDK (android.jar + aapt2)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          D=app/src/main/assets/bundled
          mkdir -p sdkwork/sdk/platforms sdkwork/sdk/build-tools/34.0.0 _plat
          for U in platform-34-ext7_r02.zip platform-34_r03.zip; do
            if curl -L --fail --retry 2 -o _plat.zip "https://dl.google.com/android/repository/$U"; then break; fi
          done
          unzip -q _plat.zip -d _plat
          P=$(dirname "$(find _plat -name android.jar | head -n 1)")
          cp -r "$P" sdkwork/sdk/platforms/android-34
          # мини-SDK: полный SDK не нужен, оставляем android.jar и то, что читает Gradle
          for N in skins templates data samples sources docs; do rm -rf "sdkwork/sdk/platforms/android-34/$N"; done
          # d8 и apksigner из build-tools кладём в мини-SDK
          mkdir -p sdkwork/sdk/build-tools/34.0.0/lib
          if curl -L --fail --retry 2 -o _bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip; then
            unzip -q _bt.zip -d _bt
            L=$(dirname "$(find _bt -name apksigner.jar | head -n 1)")
            cp "$L/apksigner.jar" "$L/d8.jar" sdkwork/sdk/build-tools/34.0.0/lib/ || true
            rm -rf _bt _bt.zip
          fi
          # папки platforms в SDK нет: android.jar лежит в build-tools/34.0.0/platform-34, приложение само создаёт platforms при установке
          mkdir -p sdkwork/sdk/build-tools/34.0.0/platform-34
          mv sdkwork/sdk/platforms/android-34/* sdkwork/sdk/build-tools/34.0.0/platform-34/
          rm -rf sdkwork/sdk/platforms
          ls -R sdkwork/sdk | head -n 40
          cp sdk-extra/aapt2 sdkwork/sdk/build-tools/34.0.0/aapt2
          printf 'Pkg.Revision=34.0.0\n' > sdkwork/sdk/build-tools/34.0.0/source.properties
          # убираем ненужное из SDK
          for N in system-images emulator sources docs extras cmake lldb; do
            find sdkwork/sdk -type d -name "$N" -prune -exec rm -rf {} + 2>/dev/null || true
          done
          du -sh sdkwork/sdk
          tar -C sdkwork -cf - sdk | xz -6e -T0 > $D/sdk.tar.xz
          ls -l $D

      - name: Embed Android NDK (aarch64)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          D=app/src/main/assets/bundled
          mkdir -p $D _ndk
          # ищем свежий релиз NDK под aarch64 (сборка для Android/Termux); если не нашли — собираем без NDK
          URL=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/lzhiyong/termux-ndk/releases \
            | jq -r '[.[].assets[] | select(.name | test("aarch64|arm64"; "i")) | select(.name | test("\\.(zip|tar\\.xz|tar\\.gz)$"))][0].browser_download_url // empty')
          echo "NDK url: $URL"
          if [ -z "$URL" ]; then echo "::warning::NDK для aarch64 не найден, APK соберётся без NDK"; exit 0; fi
          if curl -L --fail --retry 3 -o _ndk/ndk.pkg "$URL"; then
            case "$URL" in
              *.zip) unzip -q _ndk/ndk.pkg -d _ndk/x ;;
              *.tar.xz) mkdir -p _ndk/x && tar -xJf _ndk/ndk.pkg -C _ndk/x ;;
              *) mkdir -p _ndk/x && tar -xzf _ndk/ndk.pkg -C _ndk/x ;;
            esac
            rm -f _ndk/ndk.pkg
            # лишнее: исходники, отладчик, профайлер, документация
            for N in sources simpleperf shader-tools python-packages docs; do
              find _ndk/x -maxdepth 3 -type d -name "$N" -prune -exec rm -rf {} + 2>/dev/null || true
            done
            du -sh _ndk/x
            tar -C _ndk/x -cf - . | xz -6e -T0 > $D/ndk.tar.xz
            ls -l $D
          else
            echo "::warning::не удалось скачать NDK, APK соберётся без него"
          fi
          rm -rf _ndk

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Check APK contents
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          ls -l "$APK"
          echo "--- главные файлы внутри APK ---"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|resources.arsc|classes[0-9]*\.dex|assets/bundled/" || true
          echo "--- итого ---"
          unzip -l "$APK" | tail -n 1
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "ОШИБКА: в APK нет AndroidManifest.xml"; exit 1; }
          unzip -l "$APK" | grep -q "resources.arsc" || { echo "ОШИБКА: в APK нет resources.arsc"; exit 1; }

      - name: Show compile errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          grep -E '^e: |What went wrong' -A3 build.log | sed 's/^/::error::/' | head -50 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
