name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip newest project zip
        run: |
          ZIP=$(git log --name-only --diff-filter=AM --format="" -- '*.zip' | grep -i '\.zip$' | head -n 1 || true)
          if [ -z "$ZIP" ]; then ZIP=$(ls -t *.zip | head -n 1); fi
          echo "Using $ZIP"
          rm -rf _project && mkdir _project
          unzip -q "$ZIP" -d _project

      - name: Find project folder
        run: |
          S=$(find _project -name settings.gradle.kts | head -n 1)
          test -n "$S" || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show compile errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          grep -E '^e: |What went wrong' -A3 build.log | sed 's/^/::error::/' | head -50 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
