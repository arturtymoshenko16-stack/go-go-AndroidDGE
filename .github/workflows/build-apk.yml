name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'myapp*.zip'
      - '**/myapp*.zip'
      - 'myapp*.7z'
      - '**/myapp*.7z'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unpack newest project archive (zip or 7z)
        run: |
          echo "Archives in repo (commit time, name):"
          ARC=""; BEST=0
          for f in *.zip *.7z; do
            [ -f "$f" ] || continue
            case "$f" in myapp*) continue ;; esac
            T=$(git log -1 --format=%ct -- "$f")
            echo "$T  $f"
            if [ "${T:-0}" -gt "$BEST" ]; then BEST=$T; ARC="$f"; fi
          done
          echo "Using $ARC"
          rm -rf _project && mkdir _project
          case "$ARC" in
            *.7z|*.7Z)
              command -v 7z >/dev/null || sudo apt-get install -y p7zip-full
              7z x -y -o_project "$ARC" > /dev/null ;;
            *) unzip -q "$ARC" -d _project ;;
          esac

      - name: Find project folder
        run: |
          S=$(find _project -name settings.gradle.kts | head -n 1)
          test -n "$S" || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV

      - name: Embed JDK and Gradle into the app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          D=app/src/main/assets/bundled
          mkdir -p $D
          mkdir -p _tmp
          curl -L --fail --retry 3 -o _tmp/jdk.zip https://github.com/Kitty-Hivens/nexira-android-jdk/releases/download/jdk-17.0.21/jdk-17.0.21-android-aarch64.zip
          # мини-JDK: убираем отладочные файлы и графические библиотеки (javac, d8, подпись их не используют)
          zip -q -d _tmp/jdk.zip '*.debuginfo' '*/lib/libawt*' '*/lib/libfontmanager*' '*/lib/libfreetype*' '*/lib/libjavajpeg*' '*/lib/liblcms*' '*/lib/libjsound*' '*/lib/libmlib_image*' '*/lib/libsplashscreen*' '*/lib/fonts/*' '*/lib/libjawt*' '*/lib/libattach*' '*/lib/libinstrument*' '*/lib/libdt_socket*' '*/lib/libjdwp*' '*/lib/libj2*' || true
          mkdir -p _tmp/jdk && unzip -q _tmp/jdk.zip -d _tmp/jdk
          tar -C _tmp/jdk -cf - . | xz -6e -T0 > $D/jdk.tar.xz
          curl -L --fail --retry 3 -o _tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p _tmp/gradle && unzip -q _tmp/gradle.zip -d _tmp/gradle
          tar -C _tmp/gradle -cf - . | xz -6e -T0 > $D/gradle.tar.xz
          rm -rf _tmp
          ls -l $D

      - name: Embed NDK into the app (unofficial Android/aarch64 build)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=app/src/main/assets/bundled
          mkdir -p $D _ndkdl _ndk
          TAG=android-ndk
          echo "NDK release: $TAG"
          gh release view "$TAG" -R Lzhiyong/termux-ndk --json assets -q '.assets[]|"\(.name) \(.size)"'
          NAMES=$(gh release view "$TAG" -R Lzhiyong/termux-ndk --json assets -q '.assets[].name')
          NAME=$(echo "$NAMES" | grep -iE 'ndk' | grep -iE 'aarch64|arm64' | head -n 1)
          [ -n "$NAME" ] || NAME=$(echo "$NAMES" | grep -iE 'ndk' | grep -iE '\.(zip|7z|tar\.[a-z0-9]+|tgz)$' | head -n 1)
          test -n "$NAME" || { echo "no aarch64 NDK asset"; exit 1; }
          gh release download "$TAG" -R Lzhiyong/termux-ndk -p "$NAME" -D _ndkdl
          F="_ndkdl/$NAME"
          case "$F" in
            *.zip) unzip -q "$F" -d _ndk ;;
            *.7z) sudo apt-get install -y p7zip-full >/dev/null; 7z x -y -o_ndk "$F" >/dev/null ;;
            *) tar -xf "$F" -C _ndk ;;
          esac
          rm -rf _ndkdl
          R=$(find _ndk -maxdepth 2 -type d -name 'android-ndk*' | head -n 1); R=${R:-_ndk}
          du -sh "$R" || true
          LL=$(find "$R/toolchains" -maxdepth 3 -type d -name 'llvm' | head -n 1)
          # --- уменьшаем NDK: оставляем только clang, линкер, sysroot и нужные библиотеки ---
          rm -rf "$R/shader-tools" "$R/python-packages" "$R/docs" "$R/sources/third_party" "$R/simpleperf" "$R/prebuilt" "$R/wrap.sh" "$R/tests" 2>/dev/null || true
          for P in $(find "$LL" -maxdepth 2 -type d -name prebuilt); do
            for X in "$P"/*; do
              rm -rf "$X/python3" "$X/share" "$X/lib/python"* "$X/lib/liblldb"* "$X/musl" 2>/dev/null || true
              find "$X/lib" -maxdepth 1 -name '*.a' -delete 2>/dev/null || true
              rm -rf "$X/include/llvm" "$X/include/llvm-c" "$X/include/clang" "$X/include/clang-c" "$X/include/lld" "$X/include/lldb" 2>/dev/null || true
              find "$X/lib" -type f \( -name '*san*' -o -name '*fuzzer*' -o -name '*scudo*' -o -name '*memprof*' -o -name '*xray*' -o -name '*orc*' -o -name '*gwp*' \) -delete 2>/dev/null || true
              # sysroot: оставляем только API 21 и 34
              for T in "$X"/sysroot/usr/lib/*/; do
                for A in "$T"*/; do
                  N=$(basename "$A")
                  case "$N" in 21|34) ;; [0-9]*) rm -rf "$A" ;; esac
                done
              done
            done
          done
          # x86 и x86_64 (x86_64-linux-android, i686-linux-android) не нужны: только ARM
          find "$R" \( -name '*x86_64-linux-android*' -o -name '*i686-linux-android*' -o -name '*-x86_64-android*' -o -name '*-i686-android*' -o -name '*i386*' \) -prune -exec rm -rf {} + 2>/dev/null || true
          find "$R" -type d \( -name 'x86_64' -o -name 'x86' -o -name 'i386' \) -path '*clang*' -prune -exec rm -rf {} + 2>/dev/null || true
          # RISC-V не нужен; lldb-server и fuzzer тоже
          find "$R" \( -name '*riscv64*' -o -name 'lldb-server' -o -iname '*fuzzer*' \) -prune -exec rm -rf {} + 2>/dev/null || true
          # файлы только для ПК (Windows / Mac) на телефоне не нужны (папка linux-x86_64 здесь НАСТОЯЩАЯ, не трогать)
          find "$R" -type d \( -name 'windows*' -o -name 'darwin*' \) -prune -exec rm -rf {} + 2>/dev/null || true
          find "$R" -type f \( -name '*.exe' -o -name '*.cmd' -o -name '*.bat' -o -name '*.dll' -o -name '*.dylib' \) -delete 2>/dev/null || true
          # в bin оставляем только компилятор, линкер и несколько утилит
          for B in $(find "$LL" -type d -name bin -path '*prebuilt*' -maxdepth 4); do
            ( cd "$B" && for F in *; do
                case "$F" in
                  clang|clang++|clang-[0-9]*|*-clang|*-clang++|ld|ld.lld|ld64.lld|lld|lld-*|llvm-ar|llvm-ranlib|llvm-strip|llvm-objcopy|llvm-nm|llvm-readelf|llvm-readobj|llvm-as|llvm-link|llvm-lib|llvm-cxxfilt|llvm-size|llvm-symbolizer|llc|opt|lli|llvm-objdump|llvm-addr2line|llvm-dwarfdump|llvm-strings|llvm-profdata) ;;
                  *) rm -rf "$F" ;;
                esac
              done ) 2>/dev/null || true
          done
          # убираем отладочную информацию из программ
          sudo apt-get install -y binutils-aarch64-linux-gnu >/dev/null 2>&1 || true
          if command -v aarch64-linux-gnu-strip >/dev/null; then
            for F in $(find "$LL" -type f -path '*/bin/*' -size +200k); do
              if head -c 4 "$F" | grep -q ELF; then aarch64-linux-gnu-strip --strip-unneeded "$F" 2>/dev/null || true; fi
            done
          fi
          test -n "$(find "$R" -type f -name 'clang-[0-9]*' | head -n 1)" || { echo "после уменьшения нет clang"; exit 1; }
          du -sh "$R" || true
          tar -C "$R" -cf - . | xz -6e -T0 > "$D/ndk.tar.xz"
          ls -l $D

      - name: Embed Android SDK (android.jar + aapt2)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          D=app/src/main/assets/bundled
          mkdir -p sdkwork/sdk/platforms sdkwork/sdk/build-tools/34.0.0 _plat
          for U in platform-34-ext7_r02.zip platform-34_r03.zip; do
            if curl -L --fail --retry 2 -o _plat.zip "https://dl.google.com/android/repository/$U"; then break; fi
          done
          unzip -q _plat.zip -d _plat
          P=$(dirname "$(find _plat -name android.jar | head -n 1)")
          cp -r "$P" sdkwork/sdk/platforms/android-34
          cp sdk-extra/aapt2 sdkwork/sdk/build-tools/34.0.0/aapt2
          printf 'Pkg.Revision=34.0.0\n' > sdkwork/sdk/build-tools/34.0.0/source.properties
          tar -C sdkwork -cf - sdk | xz -6e -T0 > $D/sdk.tar.xz
          ls -l $D

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Check APK contents
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          ls -l "$APK"
          echo "--- главные файлы внутри APK ---"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|resources.arsc|classes[0-9]*\.dex|assets/bundled/" || true
          echo "--- итого ---"
          unzip -l "$APK" | tail -n 1
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "ОШИБКА: в APK нет AndroidManifest.xml"; exit 1; }
          unzip -l "$APK" | grep -q "resources.arsc" || { echo "ОШИБКА: в APK нет resources.arsc"; exit 1; }

      - name: Show compile errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          grep -E '^e: |What went wrong' -A3 build.log | sed 's/^/::error::/' | head -50 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
