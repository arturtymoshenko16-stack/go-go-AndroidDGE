name: Build File Manager APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'manager-app/**'
      - '.github/workflows/build-file-manager.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: manager-app
        run: gradle assembleDebug --no-daemon --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileManagerAPK-debug
          path: manager-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
