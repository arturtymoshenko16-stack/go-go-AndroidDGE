plugins { id 'com.android.application' }

android {
    namespace 'com.filemanager.apk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.filemanager.apk'
        minSdk 23
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
